<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 과열 지수 분석기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --parchment: #FAF0E6;
    --warm-white: #FFFDF9;
    --orange: #FF6B35;
    --orange-light: #FF8C5A;
    --gold: #FFD166;
    --brown-dark: #3D1F00;
    --brown-mid: #8B4513;
    --brown-light: #C8956C;
    --apricot: #FFDAB9;
    --red-hot: #C1440E;
    --shadow: rgba(61,31,0,0.12);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--cream);
    color: var(--brown-dark);
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(255,209,102,0.18) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(255,107,53,0.12) 0%, transparent 60%);
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 40px 20px 28px;
    background: linear-gradient(135deg, rgba(255,248,240,0.95), rgba(250,240,230,0.95));
    border-bottom: 2px solid rgba(200,149,108,0.25);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-icon { font-size: 2.4rem; margin-bottom: 6px; animation: flicker 3s ease-in-out infinite; }
  @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.8} }
  header h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; color: var(--brown-dark); letter-spacing: -0.5px; }
  header p { font-size: 0.88rem; color: var(--brown-mid); margin-top: 4px; }

  /* SEARCH */
  .search-section { padding: 28px 20px 20px; max-width: 680px; margin: 0 auto; }
  .search-box {
    display: flex; gap: 10px; flex-wrap: wrap;
    background: var(--warm-white);
    border: 2px solid var(--apricot);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: 0 4px 20px var(--shadow);
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--orange); }
  .search-box input {
    flex: 1; min-width: 200px; border: none; outline: none;
    font-family: inherit; font-size: 1rem; background: transparent; color: var(--brown-dark);
  }
  .search-box input::placeholder { color: var(--brown-light); }
  .btn-analyze {
    background: linear-gradient(135deg, var(--orange), var(--red-hot));
    color: #fff; border: none; border-radius: 12px;
    padding: 10px 24px; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 3px 12px rgba(193,68,14,0.35);
  }
  .btn-analyze:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(193,68,14,0.4); }
  .btn-analyze:active { transform: translateY(0); }
  .btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .search-hints { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .hint-chip {
    background: var(--apricot); border: 1px solid rgba(200,149,108,0.4);
    border-radius: 20px; padding: 5px 14px; font-size: 0.8rem; color: var(--brown-mid);
    cursor: pointer; transition: background 0.15s;
  }
  .hint-chip:hover { background: var(--gold); }

  /* MAIN LAYOUT */
  .main-content { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }

  /* THERMOMETER COLUMN */
  .thermo-column { position: sticky; top: 120px; }
  .thermo-card {
    background: var(--warm-white);
    border-radius: var(--radius); border: 2px solid rgba(200,149,108,0.2);
    box-shadow: 0 8px 32px var(--shadow); padding: 28px 20px;
    text-align: center;
  }
  .thermo-card h3 { font-size: 0.85rem; color: var(--brown-light); margin-bottom: 16px; letter-spacing: 0.5px; text-transform: uppercase; }
  .thermometer-wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; }
  #thermo-svg { width: 90px; height: 280px; overflow: visible; }
  .score-display { margin-top: 16px; }
  .score-number { font-size: 3rem; font-weight: 700; line-height: 1; transition: color 0.8s; }
  .score-label { font-size: 1rem; font-weight: 500; margin-top: 6px; transition: color 0.8s; }
  .score-temp { font-size: 0.85rem; color: var(--brown-light); margin-top: 4px; }
  .score-emoji { font-size: 1.8rem; margin-top: 8px; }
  .flame-wrap { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 1.8rem; opacity: 0; transition: opacity 0.5s; animation: rise 1s ease-in-out infinite; }
  @keyframes rise { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-6px)} }

  /* RESULTS COLUMN */
  .results-column {}
  .placeholder-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 360px; gap: 12px; color: var(--brown-light);
  }
  .placeholder-state .big-emoji { font-size: 4rem; opacity: 0.4; }
  .placeholder-state p { font-size: 0.95rem; }

  .loading-state { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 360px; gap: 16px; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid var(--apricot);
    border-top-color: var(--orange); border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state p { color: var(--brown-mid); font-size: 0.95rem; }

  .results-grid { display: flex; flex-direction: column; gap: 18px; }
  .result-card {
    background: var(--warm-white); border-radius: var(--radius);
    border: 2px solid rgba(200,149,108,0.18);
    box-shadow: 0 4px 18px var(--shadow); padding: 22px 24px;
    opacity: 0; transform: translateY(16px);
    animation: fadeUp 0.5s ease forwards;
  }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .result-card:nth-child(1) { animation-delay: 0.05s; }
  .result-card:nth-child(2) { animation-delay: 0.15s; }
  .result-card:nth-child(3) { animation-delay: 0.25s; }
  .result-card:nth-child(4) { animation-delay: 0.35s; }
  .result-card h4 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--brown-light); margin-bottom: 12px; }
  .summary-card .company-name { font-size: 1.3rem; font-weight: 700; color: var(--brown-dark); }
  .summary-card .ticker-badge {
    display: inline-block; background: var(--apricot); border-radius: 8px;
    padding: 2px 10px; font-size: 0.8rem; font-weight: 700; color: var(--brown-mid); margin-left: 8px;
  }
  .summary-text { margin-top: 10px; line-height: 1.7; font-size: 0.95rem; color: var(--brown-mid); }

  .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 4px; }
  .breakdown-item { background: var(--cream); border-radius: 10px; padding: 10px 12px; }
  .breakdown-item .b-label { font-size: 0.75rem; color: var(--brown-light); margin-bottom: 4px; }
  .breakdown-item .b-bar { height: 6px; background: var(--apricot); border-radius: 3px; overflow: hidden; }
  .breakdown-item .b-fill { height: 100%; border-radius: 3px; transition: width 1.2s ease; }
  .breakdown-item .b-score { font-size: 0.88rem; font-weight: 700; color: var(--brown-dark); margin-top: 4px; }

  .factors-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .factors-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 0.9rem; line-height: 1.5; }
  .factors-list li::before { content: '•'; color: var(--orange); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

  .opinion-text { line-height: 1.8; font-size: 0.93rem; color: var(--brown-mid); }
  .historical-box { background: var(--cream); border-left: 3px solid var(--gold); border-radius: 6px; padding: 12px 14px; font-size: 0.88rem; line-height: 1.7; color: var(--brown-mid); }

  /* HISTORY */
  .history-section { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; }
  .history-section h3 { font-size: 1rem; font-weight: 700; color: var(--brown-mid); margin-bottom: 14px; }
  .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .history-card {
    background: var(--warm-white); border-radius: 12px;
    border: 2px solid rgba(200,149,108,0.18); padding: 14px 16px;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
    display: flex; flex-direction: column; gap: 4px;
  }
  .history-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px var(--shadow); }
  .history-card .h-ticker { font-weight: 700; font-size: 0.95rem; }
  .history-card .h-score { font-size: 1.5rem; font-weight: 700; }
  .history-card .h-level { font-size: 0.78rem; color: var(--brown-light); }

  /* ERROR */
  .error-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #3D1F00; color: #fff; border-radius: 12px; padding: 12px 24px;
    font-size: 0.88rem; box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999;
  }
  .error-toast.show { opacity: 1; }

  footer { text-align: center; padding: 20px; font-size: 0.78rem; color: var(--brown-light); border-top: 1px solid rgba(200,149,108,0.2); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>

<header>
  <div class="header-icon">🌡️</div>
  <h1>주식 과열 지수 분석기</h1>
  <p>AI가 분석하는 주식 시장 과열 온도계</p>
</header>

<section class="search-section" aria-label="종목 검색">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="종목명 또는 심볼 입력 (예: NVDA, 삼성전자, TSLA)" aria-label="종목 검색" autocomplete="off">
    <button class="btn-analyze" id="btn-analyze" onclick="handleAnalyze()">🔍 분석하기</button>
  </div>
  <div class="search-hints" role="group" aria-label="빠른 검색">
    <span class="hint-chip" onclick="quickSearch('NVDA')">NVDA</span>
    <span class="hint-chip" onclick="quickSearch('TSLA')">TSLA</span>
    <span class="hint-chip" onclick="quickSearch('AAPL')">AAPL</span>
    <span class="hint-chip" onclick="quickSearch('AMZN')">AMZN</span>
    <span class="hint-chip" onclick="quickSearch('META')">META</span>
    <span class="hint-chip" onclick="quickSearch('삼성전자')">삼성전자</span>
  </div>
</section>

<main class="main-content" id="main-content">
  <!-- THERMOMETER -->
  <aside class="thermo-column" aria-label="과열 지수 온도계">
    <div class="thermo-card">
      <h3>과열 온도계</h3>
      <div class="thermometer-wrap">
        <div class="flame-wrap" id="flame-wrap">🔥</div>
        <svg id="thermo-svg" viewBox="0 0 90 280" role="img" aria-label="온도계">
          <defs>
            <linearGradient id="thermGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%"   stop-color="#4FC3F7"/>
              <stop offset="25%"  stop-color="#66BB6A"/>
              <stop offset="50%"  stop-color="#FFF176"/>
              <stop offset="75%"  stop-color="#FFA726"/>
              <stop offset="100%" stop-color="#C62828"/>
            </linearGradient>
            <clipPath id="thermo-clip">
              <!-- 초기값: height=0, y=238 (완전히 비어있는 상태) -->
              <rect id="thermo-clip-rect" x="30" y="238" width="30" height="0" rx="0"/>
            </clipPath>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Tube background -->
          <rect x="30" y="28" width="30" height="210" rx="15" ry="15" fill="#F0E8DF" stroke="rgba(200,149,108,0.4)" stroke-width="2"/>
          <!-- Scale marks -->
          <g fill="none" stroke="rgba(139,69,19,0.35)" stroke-width="1" font-size="9" fill="none">
            <line x1="58" y1="38"  x2="66" y2="38"/><text x="68" y="42"  fill="#8B4513" font-size="8">100</text>
            <line x1="58" y1="59"  x2="63" y2="59"/><text x="65" y="63"  fill="#8B4513" font-size="8">90</text>
            <line x1="58" y1="80"  x2="66" y2="80"/><text x="68" y="84"  fill="#8B4513" font-size="8">80</text>
            <line x1="58" y1="101" x2="63" y2="101"/><text x="65" y="105" fill="#8B4513" font-size="8">70</text>
            <line x1="58" y1="122" x2="66" y2="122"/><text x="68" y="126" fill="#8B4513" font-size="8">60</text>
            <line x1="58" y1="143" x2="63" y2="143"/><text x="65" y="147" fill="#8B4513" font-size="8">50</text>
            <line x1="58" y1="164" x2="66" y2="164"/><text x="68" y="168" fill="#8B4513" font-size="8">40</text>
            <line x1="58" y1="185" x2="63" y2="185"/><text x="65" y="189" fill="#8B4513" font-size="8">30</text>
            <line x1="58" y1="206" x2="66" y2="206"/><text x="68" y="210" fill="#8B4513" font-size="8">20</text>
            <line x1="58" y1="228" x2="63" y2="228"/><text x="65" y="232" fill="#8B4513" font-size="8">10</text>
          </g>
          <!-- Fill (클립 영역 내에서만 표시) -->
          <g clip-path="url(#thermo-clip)">
            <rect x="30" y="28" width="30" height="210" fill="url(#thermGrad)" filter="url(#glow)"/>
          </g>
          <!-- Tube outline -->
          <rect x="30" y="28" width="30" height="210" rx="15" ry="15" fill="none" stroke="rgba(200,149,108,0.6)" stroke-width="2.5"/>
          <!-- Bulb -->
          <circle cx="45" cy="248" r="20" fill="#E53935" stroke="rgba(200,149,108,0.5)" stroke-width="2" filter="url(#glow)"/>
          <circle cx="45" cy="248" r="20" fill="url(#thermGrad)"/>
          <circle cx="39" cy="242" r="5" fill="rgba(255,255,255,0.35)"/>
          <!-- Glass shimmer -->
          <rect x="36" y="30" width="6" height="206" rx="3" fill="rgba(255,255,255,0.22)"/>
        </svg>
      </div>
      <div class="score-display">
        <div class="score-number" id="score-number" style="color: var(--brown-light)">--</div>
        <div class="score-label" id="score-label" style="color: var(--brown-light)">대기 중</div>
        <div class="score-temp" id="score-temp"></div>
        <div class="score-emoji" id="score-emoji">🌡️</div>
      </div>
    </div>
  </aside>

  <!-- RESULTS -->
  <section class="results-column" aria-live="polite" aria-atomic="true">
    <div class="placeholder-state" id="placeholder-state">
      <div class="big-emoji">📊</div>
      <p>종목을 입력하고 분석 버튼을 누르세요</p>
    </div>
    <div class="loading-state" id="loading-state">
      <div class="spinner" role="status" aria-label="분석 중"></div>
      <p id="loading-msg">AI가 주식 과열 지수를 분석 중입니다...</p>
    </div>
    <div class="results-grid" id="results-grid" style="display:none"></div>
  </section>
</main>

<section class="history-section" id="history-section" style="display:none" aria-label="최근 분석 기록">
  <h3>📋 최근 분석 기록</h3>
  <div class="history-grid" id="history-grid"></div>
</section>

<footer>
  <p>⚠️ 본 분석은 AI 기반 참고 정보입니다. 투자 결정 전 반드시 전문가 상담을 받으세요.</p>
</footer>

<div class="error-toast" id="error-toast" role="alert"></div>

<script>
// ============================================================
// LLM Analysis Module (llm-analysis.js 인라인)
// ============================================================
window.StockAnalyzer = (() => {
  const CONFIG = {
    openrouter: {
      url: 'https://openrouter.ai/api/v1/chat/completions',
      apiKey: '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',
      models: ['deepseek/deepseek-chat:free', 'deepseek/deepseek-r1:free'],
    },
    openai: {
      url: 'https://api.openai.com/v1/chat/completions',
      apiKey: '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',
      model: 'gpt-4o-mini',
    },
    cache: { ttl: 30 * 60 * 1000 },
    batch: { concurrency: 3, delay: 500 },
  };

  const OVERHEAT_LEVELS = [
    { max: 20,  level: '냉각',       color: '#4FC3F7', emoji: '🧊', desc: '저평가 구간, 매수 관심 가능' },
    { max: 40,  level: '정상',       color: '#66BB6A', emoji: '✅', desc: '적정 가치 범위' },
    { max: 60,  level: '주의',       color: '#FFF176', emoji: '⚠️', desc: '약간 고평가, 주시 필요' },
    { max: 75,  level: '과열',       color: '#FFA726', emoji: '🔥', desc: '명확한 과열 신호' },
    { max: 90,  level: '고위험 과열', color: '#EF5350', emoji: '🚨', desc: '버블 위험 수준' },
    { max: 100, level: '극도 과열',  color: '#B71C1C', emoji: '💥', desc: '역사적 버블 수준' },
  ];

  // Cache
  const _cache = {
    get(ticker) {
      try {
        const raw = sessionStorage.getItem('stock_analysis_' + ticker.toUpperCase());
        if (!raw) return null;
        const { data, expires } = JSON.parse(raw);
        if (Date.now() > expires) { sessionStorage.removeItem('stock_analysis_' + ticker.toUpperCase()); return null; }
        return data;
      } catch { return null; }
    },
    set(ticker, data) {
      try {
        sessionStorage.setItem('stock_analysis_' + ticker.toUpperCase(), JSON.stringify({
          data, expires: Date.now() + CONFIG.cache.ttl
        }));
      } catch {}
    },
    clear(ticker) { sessionStorage.removeItem('stock_analysis_' + ticker.toUpperCase()); },
    clearAll() {
      Object.keys(sessionStorage).filter(k => k.startsWith('stock_analysis_')).forEach(k => sessionStorage.removeItem(k));
    },
  };

  function getSystemPrompt() {
    return '당신은 30년 경력의 글로벌 퀀트 애널리스트입니다. 주식 시장의 과열 지수를 전문적으로 분석합니다.\n\n' +
      '분석 기준 (가중치):\n' +
      '- 밸류에이션 30%: P/E, P/B, PEG, EV/EBITDA 등 상대적 고평가 정도\n' +
      '- 모멘텀 25%: 52주 상승률, RSI, 이동평균 이탈, 추세 강도\n' +
      '- 투기적 과열 신호 20%: 공매도 비율, 옵션 시장 이상, 소셜미디어/뉴스 열기\n' +
      '- 펀더멘털 대비 주가 15%: 실적 성장 대비 주가 프리미엄\n' +
      '- 시장 비교 10%: 동종 업계, S&P 500 대비 과열 정도\n\n' +
      '과열 지수 척도:\n' +
      '0-20: 냉각 | 21-40: 정상 | 41-60: 주의 | 61-75: 과열 | 76-90: 고위험 과열 | 91-100: 극도 과열\n\n' +
      '역사적 참고: 닷컴 버블(2000), 서브프라임(2008), 밈주식(2021) 등과 비교 관점 포함.\n\n' +
      '⚠️ 반드시 순수 JSON만 반환하세요. 마크다운, 설명 텍스트, 코드블록 없이 오직 JSON 객체만 출력하세요.';
  }

  function buildUserPrompt(ticker, companyName) {
    const name = companyName || ticker;
    const date = new Date().toLocaleDateString('ko-KR');
    return name + ' (' + ticker.toUpperCase() + ') 주식의 과열 지수를 분석해주세요. 분석일: ' + date + '\n\n' +
      '다음 JSON 형식으로만 응답하세요 (다른 텍스트 없이):\n\n' +
      '{\n' +
      '  "ticker": "' + ticker.toUpperCase() + '",\n' +
      '  "company_name": "회사 정식 명칭",\n' +
      '  "analysis_date": "' + date + '",\n' +
      '  "overheat_index": 0~100 사이 정수,\n' +
      '  "overheat_level": "냉각/정상/주의/과열/고위험 과열/극도 과열 중 하나",\n' +
      '  "temperature_display": "섭씨 온도 표현 (예: 85°C)",\n' +
      '  "analysis_summary": "2-3문장 핵심 요약",\n' +
      '  "score_breakdown": {\n' +
      '    "valuation": 0~100 정수,\n' +
      '    "momentum": 0~100 정수,\n' +
      '    "speculative_signals": 0~100 정수,\n' +
      '    "fundamental_premium": 0~100 정수,\n' +
      '    "market_comparison": 0~100 정수\n' +
      '  },\n' +
      '  "key_overheat_factors": ["주요 과열 요인 1", "요인 2", "요인 3"],\n' +
      '  "key_risk_factors": ["리스크 1", "리스크 2", "리스크 3"],\n' +
      '  "investment_opinion": "상세 투자 의견 (3-4문장)",\n' +
      '  "historical_comparison": "역사적 버블 사례와 비교",\n' +
      '  "market_context": "현재 시장 환경에서의 위치",\n' +
      '  "data_sources": ["분석 근거 데이터 1", "근거 2"],\n' +
      '  "confidence_note": "분석 신뢰도 관련 주의사항"\n' +
      '}';
  }

  function parseResponse(raw) {
    let text = typeof raw === 'string' ? raw : JSON.stringify(raw);

    // 마크다운 코드블록 및 앞뒤 텍스트 제거
    text = text.replace(/```(?:json)?\s*/gi, '').replace(/```\s*/g, '');
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('JSON 객체를 찾을 수 없습니다');
    text = text.slice(start, end + 1);

    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch {
      // trailing comma, 단일따옴표 보정
      text = text.replace(/,(\s*[}\]])/g, '$1').replace(/'/g, '"');
      parsed = JSON.parse(text);
    }

    // 필수 필드 검증
    const required = ['overheat_index', 'overheat_level', 'analysis_summary'];
    for (const field of required) {
      if (parsed[field] === undefined) throw new Error('필수 필드 누락: ' + field);
    }

    // 점수 범위 정규화
    parsed.overheat_index = Math.max(0, Math.min(100, Math.round(Number(parsed.overheat_index))));

    // 레벨 점수 기반 덮어쓰기
    const levelInfo = getOverheatLevel(parsed.overheat_index);
    parsed.overheat_level = levelInfo.level;
    parsed.level_color = levelInfo.color;
    parsed.level_emoji = levelInfo.emoji;

    // 신뢰도 점수
    parsed.confidence_score = calcConfidence(parsed);

    // 배열 보정
    if (!Array.isArray(parsed.key_risk_factors)) parsed.key_risk_factors = [];
    if (!Array.isArray(parsed.key_overheat_factors)) parsed.key_overheat_factors = [];
    if (!Array.isArray(parsed.data_sources)) parsed.data_sources = [];

    // 기본값
    parsed.temperature_display = parsed.temperature_display || (Math.round(parsed.overheat_index * 0.8 + 20) + '°C');
    parsed.ticker = (parsed.ticker || '').toUpperCase();

    return parsed;
  }

  function calcConfidence(data) {
    let score = 100;
    const breakdown = data.score_breakdown || {};
    const fields = ['valuation', 'momentum', 'speculative_signals', 'fundamental_premium', 'market_comparison'];
    const missing = fields.filter(f => breakdown[f] === undefined).length;
    score -= missing * 6;

    if (fields.every(f => breakdown[f] !== undefined)) {
      const weights = [0.30, 0.25, 0.20, 0.15, 0.10];
      const weighted = fields.reduce((sum, f, i) => sum + breakdown[f] * weights[i], 0);
      if (Math.abs(weighted - data.overheat_index) > 15) score -= 25;
    }

    if (!data.investment_opinion) score -= 8;
    if (!data.historical_comparison) score -= 8;
    if (!data.market_context) score -= 8;
    if (!data.analysis_summary) score -= 8;

    return Math.max(0, Math.min(100, score));
  }

  function getOverheatLevel(score) {
    return OVERHEAT_LEVELS.find(l => score <= l.max) || OVERHEAT_LEVELS[OVERHEAT_LEVELS.length - 1];
  }

  async function callOpenRouter(messages, modelIndex) {
    modelIndex = modelIndex || 0;
    const model = CONFIG.openrouter.models[modelIndex];
    if (!model) throw new Error('No more OpenRouter models to try');
    const res = await fetch(CONFIG.openrouter.url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + CONFIG.openrouter.apiKey,
        'HTTP-Referer': window.location.href,
        'X-Title': 'Stock Overheating Analyzer',
      },
      body: JSON.stringify({ model, messages, temperature: 0.3, max_tokens: 1500 }),
    });
    if (!res.ok) {
      const err = await res.text();
      if (modelIndex + 1 < CONFIG.openrouter.models.length) {
        return callOpenRouter(messages, modelIndex + 1);
      }
      throw new Error('OpenRouter ' + res.status + ': ' + err);
    }
    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
  }

  async function callOpenAI(messages) {
    const res = await fetch(CONFIG.openai.url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + CONFIG.openai.apiKey,
      },
      body: JSON.stringify({
        model: CONFIG.openai.model,
        messages,
        temperature: 0.3,
        max_tokens: 1500,
        response_format: { type: 'json_object' },
      }),
    });
    if (!res.ok) throw new Error('OpenAI ' + res.status + ': ' + await res.text());
    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
  }

  async function callLLMWithFallback(messages) {
    // 1차: OpenRouter
    try {
      const result = await callOpenRouter(messages, 0);
      if (result) return result;
    } catch (e) {
      console.warn('OpenRouter 실패, OpenAI로 폴백:', e.message);
    }
    // 2차: OpenAI
    return await callOpenAI(messages);
  }

  function buildDefaultResult(ticker, error) {
    return {
      ticker: ticker.toUpperCase(),
      company_name: ticker,
      analysis_date: new Date().toLocaleDateString('ko-KR'),
      overheat_index: 50,
      overheat_level: '주의',
      temperature_display: '60°C',
      analysis_summary: '현재 API 오류로 정확한 분석을 제공할 수 없습니다. 잠시 후 다시 시도해주세요.',
      score_breakdown: { valuation: 50, momentum: 50, speculative_signals: 50, fundamental_premium: 50, market_comparison: 50 },
      key_overheat_factors: ['분석 불가'],
      key_risk_factors: ['API 오류: ' + ((error && error.message) || '알 수 없는 오류')],
      investment_opinion: '데이터를 불러올 수 없어 투자 의견을 제공할 수 없습니다.',
      historical_comparison: '분석 불가',
      market_context: '분석 불가',
      data_sources: [],
      confidence_score: 0,
      level_color: '#FFF176',
      level_emoji: '⚠️',
      is_error: true,
    };
  }

  async function analyzeStock(ticker, options) {
    options = options || {};
    const key = ticker.toUpperCase();
    if (!options.forceRefresh) {
      const cached = _cache.get(key);
      if (cached) return Object.assign({}, cached, { from_cache: true });
    }

    const messages = [
      { role: 'system', content: getSystemPrompt() },
      { role: 'user', content: buildUserPrompt(ticker, options.companyName) },
    ];

    try {
      const raw = await callLLMWithFallback(messages);
      const parsed = parseResponse(raw);
      _cache.set(key, parsed);
      return parsed;
    } catch (e) {
      console.error('분석 실패 (' + ticker + '):', e);
      return buildDefaultResult(ticker, e);
    }
  }

  async function batchAnalyze(tickers, options) {
    options = options || {};
    const results = [];
    for (let i = 0; i < tickers.length; i += CONFIG.batch.concurrency) {
      const batch = tickers.slice(i, i + CONFIG.batch.concurrency);
      const settled = await Promise.allSettled(batch.map(t => analyzeStock(t, options)));
      settled.forEach(function(s, idx) {
        results.push(s.status === 'fulfilled' ? s.value : buildDefaultResult(batch[idx], s.reason));
      });
      if (i + CONFIG.batch.concurrency < tickers.length) {
        await new Promise(function(r) { setTimeout(r, CONFIG.batch.delay); });
      }
    }
    return results;
  }

  return {
    analyzeStock,
    batchAnalyze,
    getSystemPrompt,
    buildUserPrompt,
    parseResponse,
    getOverheatLevel,
    cache: _cache,
    getConfig: function() {
      return Object.assign({}, CONFIG, {
        openrouter: Object.assign({}, CONFIG.openrouter, { apiKey: '***' }),
        openai: Object.assign({}, CONFIG.openai, { apiKey: '***' }),
      });
    },
  };
})();

function getScoreColor(score) {
  if (score <= 20) return '#4FC3F7';
  if (score <= 40) return '#66BB6A';
  if (score <= 60) return '#FFF176';
  if (score <= 75) return '#FFA726';
  if (score <= 90) return '#EF5350';
  return '#B71C1C';
}

function animateThermometer(targetScore) {
  const clipRect = document.getElementById('thermo-clip-rect');
  if (!clipRect) return;
  const totalH = 210;
  const bottomY = 238;
  const duration = 1800;
  const start = performance.now();

  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    const current = ease * targetScore;
    const fillH = (current / 100) * totalH;
    clipRect.setAttribute('y', String(bottomY - fillH));
    clipRect.setAttribute('height', String(fillH));
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      const finalH = (targetScore / 100) * totalH;
      clipRect.setAttribute('y', String(bottomY - finalH));
      clipRect.setAttribute('height', String(finalH));
    }
  }
  requestAnimationFrame(step);
}

function updateScoreDisplay(score, level, emoji, temp) {
  const color = getScoreColor(score);
  const numEl = document.getElementById('score-number');
  const labelEl = document.getElementById('score-label');
  const emojiEl = document.getElementById('score-emoji');
  const tempEl = document.getElementById('score-temp');
  const flame = document.getElementById('flame-wrap');
  numEl.textContent = score;
  numEl.style.color = color;
  labelEl.textContent = level || '분석 완료';
  labelEl.style.color = color;
  emojiEl.textContent = emoji || '🌡️';
  tempEl.textContent = temp || '';
  flame.style.opacity = score >= 90 ? '1' : '0';
  animateThermometer(score);
}

async function handleAnalyze() {
  const input = document.getElementById('search-input').value.trim();
  if (!input) {
    showError('종목명 또는 심볼을 입력해주세요.');
    return;
  }
  if (typeof window.StockAnalyzer === 'undefined') {
    showError('분석 모듈이 로드되지 않았습니다. 페이지를 새로고침해 주세요.');
    return;
  }

  showLoading(true);
  document.getElementById('loading-msg').textContent = '"' + input + '" 과열 지수 분석 중...';

  try {
    const result = await window.StockAnalyzer.analyzeStock(input, { companyName: input });
    updateScoreDisplay(result.overheat_index, result.overheat_level, result.level_emoji, result.temperature_display);
    renderResults(result);
    addHistory(result);
    if (result.is_error) {
      showError('분석 중 오류가 발생하여 기본값을 표시합니다.');
    }
  } catch (e) {
    showError('분석 중 오류가 발생했습니다: ' + e.message);
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('placeholder-state').style.display = 'flex';
    document.getElementById('btn-analyze').disabled = false;
  }
}
